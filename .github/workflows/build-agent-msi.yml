name: Build and publish Agent MSI

# Issue #107: builda o Agent Python (PyInstaller) e empacota o instalador
# (WiX v3 Toolset, via Chocolatey), depois publica automaticamente no
# Guardian via POST /api/agent-installer/publish (token de máquina, ver
# app/Services/Migration/AgentInstallerPublisher.php no repo principal).
#
# NUNCA VALIDADO de ponta a ponta (primeira execução real é a primeira
# validação de verdade -- este workflow foi escrito sem acesso a uma
# máquina Windows/WiX pra testar antes). Se falhar, o log da run no GitHub
# Actions mostra exatamente onde -- ajustar a partir daí.
#
# Secrets necessários no repositório (Settings > Secrets and variables > Actions):
#   AGENT_INSTALLER_PUBLISH_TOKEN -- mesmo valor de AGENT_INSTALLER_PUBLISH_TOKEN no .env do Guardian
#   GUARDIAN_BASE_URL             -- ex: https://guardian.nuventi.cloud
#
# Cada build vira também uma GitHub Release (tag build-<numero da run>,
# .msi anexado) -- histórico navegável direto no GitHub, complementar ao
# agent-releases/history/ do próprio Guardian (útil pra pegar uma build
# antiga sem precisar de acesso ao Guardian).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # necessário pra criar a tag/release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: pywin32 post-install (registra pythoncom/pywintypes no PATH)
        # Issue #107: bug real numa instalação de verdade -- "Service ...
        # failed to start" -- causa raiz era pythoncomXX.dll/pywintypesXX.dll
        # não resolvidos pelo processo congelado. O caminho usado aqui antes
        # (relativo a win32com.__file__) estava errado e o continue-on-error
        # mascarou a falha silenciosamente; localizando via sysconfig agora
        # (Scripts/ é onde pip realmente instala o script) e sem mascarar
        # erro -- esse passo é só um REFORÇO, a defesa principal é bundlar
        # os DLLs direto no build_exe.spec (binaries=[...]).
        shell: pwsh
        run: |
          $scriptsDir = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $postinstall = Join-Path $scriptsDir "pywin32_postinstall.py"
          if (Test-Path $postinstall) {
            python $postinstall -install
          } else {
            Write-Warning "pywin32_postinstall.py nao encontrado em $scriptsDir -- seguindo so com o bundling explicito no build_exe.spec"
          }

      - name: Build executável (PyInstaller)
        run: pyinstaller packaging\build_exe.spec

      - name: Instalar WiX Toolset v3
        run: choco install wixtoolset -y --no-progress

      - name: Baixar Visual C++ Redistributable (embutido no MSI)
        # Link permanente oficial da Microsoft (sempre aponta pra ultima
        # versao do VC++ 2015-2022 x64) -- embutido no installer.wxs via
        # <Binary SourceFile="vc_redist.x64.exe">, resolvido por caminho
        # relativo ao proprio installer.wxs (packaging\).
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "packaging\vc_redist.x64.exe"

      - name: Harvestar dependencias do PyInstaller (heat.exe)
        # Issue #107: PyInstaller volta a gerar modo "onedir" (ver
        # build_exe.spec) -- dist\guardian-migration-agent\_internal\ tem
        # dezenas de DLLs/arquivos do runtime do Python que mudam a cada
        # build/versao do PyInstaller. Listar isso a mao no installer.wxs
        # seria fragil; heat.exe (harvester do proprio WiX Toolset) escaneia
        # a pasta e gera o fragmento (.wxs) com todos os arquivos sozinho.
        # heat.exe gera <Component> em 32-bit por padrao ao escanear um
        # diretorio -- "-platform x64" NAO tem efeito nesse modo de harvest
        # (testado, ICE80 continuou aparecendo mesmo com a flag). Corrigido
        # aplicando uma transformacao XSLT (-t) que adiciona Win64="yes" em
        # todo Component gerado -- ver packaging/heat_x64_transform.xsl.
        shell: pwsh
        run: |
          $wixBin = Join-Path $env:WIX "bin"
          $internalDir = Resolve-Path "dist\guardian-migration-agent\_internal"
          & "$wixBin\heat.exe" dir "$internalDir" -cg InternalFiles -gg -sfrag -srd -dr INTERNALDIR -var var.InternalSourceDir -t packaging\heat_x64_transform.xsl -out packaging\internal_files.wxs
          if ($LASTEXITCODE -ne 0) { throw "heat.exe falhou" }

      - name: Build instalador (.msi)
        # Issue #107: -ext WixUIExtension necessario a partir daqui pro
        # wizard com tela de atalhos opcionais (Menu Iniciar/Area de
        # Trabalho, ver <UIRef Id="WixUI_Minimal"> no installer.wxs), sem
        # essa extensao candle.exe/light.exe nao reconhecem WixUI_Minimal
        # nem os elementos <UI>/<Publish> que dependem dela.
        #
        # -sice:ICE03/38/43/57 suprime falsos positivos reais do
        # validador padrao do WiX pro nosso cenario deliberado (shortcuts
        # em ProgramMenuFolder/DesktopFolder + Package InstallScope=
        # "perMachine", ou seja, instalacao pra todos os usuarios, nao
        # so o usuario atual): essas ICEs esperam por padrao que a
        # RegistryValue usada como KeyPath de um componente com shortcut
        # fique em HKCU, mas isso so faz sentido pra instalacao per-user
        # -- com ALLUSERS=1 (que o WiX seta sozinho por causa do
        # InstallScope="perMachine" do Package), HKLM e o correto.
        shell: pwsh
        run: |
          $wixBin = Join-Path $env:WIX "bin"
          $internalDir = Resolve-Path "dist\guardian-migration-agent\_internal"
          & "$wixBin\candle.exe" "-dInternalSourceDir=$internalDir" -ext WixUIExtension packaging\installer.wxs packaging\internal_files.wxs -out packaging\
          if ($LASTEXITCODE -ne 0) { throw "candle.exe falhou" }
          & "$wixBin\light.exe" -ext WixUIExtension -sice:ICE03 -sice:ICE38 -sice:ICE43 -sice:ICE57 packaging\installer.wixobj packaging\internal_files.wixobj -out dist\GuardianMigrationAgent.msi
          if ($LASTEXITCODE -ne 0) { throw "light.exe falhou" }

      - name: Upload artefato (backup de curto prazo, independente da Release)
        uses: actions/upload-artifact@v4
        with:
          name: GuardianMigrationAgent-msi
          path: dist/GuardianMigrationAgent.msi

      - name: Calcula numero de build com zero-padding
        # A lista de Releases do GitHub ordena a tag como STRING -- sem
        # zero-padding, "build-10"/"build-11" aparecem antes de
        # "build-7"/"build-8"/"build-9" (o caractere "1" e "menor" que "7").
        # Zero-padding pra 4 digitos resolve a ordenacao.
        id: buildnum
        shell: pwsh
        run: |
          $padded = "{0:D4}" -f [int]"${{ github.run_number }}"
          echo "padded=$padded" >> $env:GITHUB_OUTPUT

      - name: Criar GitHub Release com o .msi anexado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.buildnum.outputs.padded }}
          name: "Agent build #${{ github.run_number }}"
          files: dist/GuardianMigrationAgent.msi
          generate_release_notes: true

      - name: Publicar no Guardian
        shell: pwsh
        env:
          PUBLISH_TOKEN: ${{ secrets.AGENT_INSTALLER_PUBLISH_TOKEN }}
          GUARDIAN_BASE_URL: ${{ secrets.GUARDIAN_BASE_URL }}
        run: |
          curl.exe --fail -X POST "$env:GUARDIAN_BASE_URL/api/agent-installer/publish" `
            -H "Authorization: Bearer $env:PUBLISH_TOKEN" `
            -F "installer=@dist/GuardianMigrationAgent.msi;filename=GuardianMigrationAgent.msi"
